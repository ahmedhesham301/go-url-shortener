services:
  db:
    image: postgres:18
    container_name: db
    environment:
      - POSTGRES_PASSWORD=1234
    ports:
      - 5432:5432
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: .
      dockerfile: devops/docker/backend.Dockerfile
    ports:
      - 8080:8089
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
  
  frontend:
    build:
      context: .
      dockerfile: devops/docker/frontend.Dockerfile
    ports:
      - 80:80
    # volumes:
    # - ./client:/usr/share/nginx/html/:ro
  pg_admin:
    image: dpage/pgadmin4:latest
    container_name: pg_admin
    environment:
      - PGADMIN_DEFAULT_EMAIL=ahmed.hesham.farag@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=1234
      - PGADMIN_LISTEN_ADDRESS=0.0.0.0
    ports:
      - 81:80
    restart: always