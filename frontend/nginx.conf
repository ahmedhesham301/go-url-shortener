http {
    include mime.types;
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8080/;
        }

        location ~ ^/(\d+)$ {
            proxy_pass http://backend:8080/$1;
        }
    }
}

events {

}